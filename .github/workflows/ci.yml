name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omni_test
          POSTGRES_PASSWORD: omni_test
          POSTGRES_DB: omni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_test -d omni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Verify
        env:
          TEST_DATABASE_URL: postgres://omni_test:omni_test@127.0.0.1:5432/omni_test
        run: bun run check
