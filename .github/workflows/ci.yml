name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: omni_test
          POSTGRES_PASSWORD: omni_test
          POSTGRES_DB: omni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_test -d omni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Prepare isolated PostgreSQL databases
        env:
          PGPASSWORD: omni_test
        run: |
          psql -h 127.0.0.1 -U omni_test -d omni_test -c 'CREATE DATABASE omni_migration_test'
          psql -h 127.0.0.1 -U omni_test -d omni_test -c 'CREATE DATABASE omni_threat_test'
      - name: Generate local TLS fixture
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/omni-test-key.pem -out /tmp/omni-test-cert.pem \
            -subj '/CN=x402.test' -addext 'subjectAltName=DNS:x402.test'
          {
            echo "PINNED_TEST_KEY=/tmp/omni-test-key.pem"
            echo "PINNED_TEST_CERT=/tmp/omni-test-cert.pem"
            echo "NODE_EXTRA_CA_CERTS=/tmp/omni-test-cert.pem"
          } >> "$GITHUB_ENV"
      - name: Verify
        env:
          TEST_DATABASE_URL: postgres://omni_test:omni_test@127.0.0.1:5432/omni_test
          MIGRATION_TEST_DATABASE_URL: postgres://omni_test:omni_test@127.0.0.1:5432/omni_migration_test
          THREAT_TEST_DATABASE_URL: postgres://omni_test:omni_test@127.0.0.1:5432/omni_threat_test
        run: bun run check
